{% load tailwind_tags %}
{% tailwind_css %}
<body class="min-h-full text-white">
    <nav class="relative flex items-center justify-between gap-4 px-6 py-4 bg-dark-brand">
        <span class="text-2xl font-bold">AI Mind</span>

        <input type="checkbox" id="nav-toggle" class="peer hidden">
        <label for="nav-toggle"
               class="sm:hidden cursor-pointer p-2 -mr-2"
               aria-label="Toggle navigation menu">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </label>

        <div class="hidden peer-checked:flex flex-col absolute top-full left-0 right-0 gap-4 px-6 py-4 bg-dark-brand
                    sm:static sm:flex sm:flex-row sm:items-center sm:gap-4 sm:px-0 sm:py-0">
            <a href="https://github.com/your-username" target="_blank" rel="noopener noreferrer"
               class="border border-white rounded px-4 py-2 text-sm text-center hover:bg-white hover:text-dark-brand transition-colors">
                My GitHub
            </a>
            <a href="https://www.linkedin.com/in/your-username" target="_blank" rel="noopener noreferrer"
               class="border border-white rounded px-4 py-2 text-sm text-center hover:bg-white hover:text-dark-brand transition-colors">
                My LinkedIn
            </a>
        </div>
    </nav>

    <main class="px-6 py-8">
        {{ plot_div|safe }}
    </main>
</body>
